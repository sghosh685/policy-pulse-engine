# ============================================================
# NetZeroX Policy Pulse Engine — Configuration
# ============================================================
# Cross-Border Compliance Insurance for North American Energy Leaders

project:
  name: "NetZeroX Policy Pulse"
  version: "1.0.0"
  tagline: "Cross-Border Compliance Insurance for Energy Leaders"

# ── Data Sources ────────────────────────────────────────────
sources:
  # 🇺🇸 United States - Federal
  - name: "EPA - Environmental Protection Agency"
    id: "epa"
    country: "US"
    type: "rss"
    url: "https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bagencies%5D%5B%5D=environmental-protection-agency&conditions%5Btype%5D%5B%5D=RULE"
    tags: ["epa", "methane", "subpart-w", "clean-air", "super-emitter"]

  - name: "SEC - Climate & Market Regulations"
    id: "sec"
    country: "US"
    type: "rss"
    url: "https://www.sec.gov/news/pressreleases.rss"
    tags: ["sec", "climate-disclosure", "scope-3", "esg"]

  - name: "DOE - Clean Energy Funding & 45Q/45V"
    id: "doe"
    country: "US"
    type: "rss"
    url: "https://www.energy.gov/rss/articles.xml"
    tags: ["doe", "hydrogen", "ccus", "ira", "45q", "45v"]

  - name: "FERC - Energy Regulatory Commission"
    id: "ferc"
    country: "US"
    type: "rss"
    url: "https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bagencies%5D%5B%5D=federal-energy-regulatory-commission"
    tags: ["ferc", "lng", "pipeline", "interconnection", "transmission"]

  # 🇨🇦 Canada - Federal
  - name: "Canada Gazette Part I (Official Regulations)"
    id: "canada-gazette"
    country: "CA"
    type: "rss"
    url: "https://gazette.gc.ca/rss/p1-eng.xml"
    tags: ["eccc", "emissions-cap", "cfr", "clean-electricity", "carbon-pricing"]

  # 🇨🇦 Canada - Provincial
  - name: "Alberta Energy Regulator (AER Bulletins)"
    id: "aer"
    country: "CA"
    type: "html"
    url: "https://www.aer.ca/regulating-development/rules-and-directives/bulletins"
    selector: "a"
    tags: ["aer", "directive-060", "directive-017", "methane", "tier"]

  - name: "BC Energy Regulator (BC-ER)"
    id: "bc-er"
    country: "CA"
    type: "html"
    url: "https://www.bc-er.ca/news/"
    selector: "article, .news-item, .post-item, a"
    tags: ["bc", "montney", "fugitive-emissions", "cleanbc"]

  # 🇺🇸 United States - State
  - name: "Texas Railroad Commission (TX RRC)"
    id: "tx-rrc"
    country: "US"
    type: "html"
    url: "https://www.rrc.texas.gov/announcements/"
    selector: "a"
    tags: ["texas", "permian", "flaring", "rule-32", "waste-prevention"]

# ── Keyword Taxonomies ──────────────────────────────────────
keywords:
  critical:
    - "methane"
    - "CH4"
    - "super-emitter"
    - "Subpart W"
    - "Scope 3"
    - "endangerment finding"
    - "emissions cap"
    - "Directive 060"
    - "Clean Electricity"
    - "penalty"
    - "enforcement"
  high:
    - "Inflation Reduction Act"
    - "45V"
    - "45Q"
    - "hydrogen"
    - "CCUS"
    - "carbon capture"
    - "flaring"
    - "venting"
    - "pipeline"
    - "liquefied natural gas"
    - "LNG"
    - "Clean Fuel Regulations"
  medium:
    - "clean fuel"
    - "carbon pricing"
    - "TIER"
    - "GHGRP"
    - "NPRI"
    - "transmission"
    - "interconnection"
    - "sustainability"

# ── AI Analyzer ─────────────────────────────────────────────
analyzer:
  model: "gpt-4o-mini"
  fallback_engine: "heuristic-energy-expert"
  temperature: 0.2

# ── Compliance Calendar ──────────────────────────────────────
calendar:
  - date: "2026-03-31"
    event: "US EPA GHGRP Subpart W Reporting (e-GGRT)"
    authority: "EPA"
    country: "US"
    impact: "CRITICAL"
    statutory_penalty: "Up to $109,024/day under Clean Air Act § 113(b)"
  - date: "2026-03-31"
    event: "Alberta TIER Compliance & True-Up Filing"
    authority: "AER"
    country: "CA"
    impact: "CRITICAL"
    statutory_penalty: "$65/tonne default fund payment requirement"
  - date: "2026-06-01"
    event: "Canada NPRI (National Pollutant Release Inventory)"
    authority: "ECCC"
    country: "CA"
    impact: "HIGH"
    statutory_penalty: "Fines up to $1,000,000 under CEPA"
  - date: "2026-09-01"
    event: "BC-ER Montney Basin Fugitive Emissions Audit"
    authority: "BC-ER"
    country: "CA"
    impact: "HIGH"
    statutory_penalty: "Administrative monetary penalties & shut-in orders"
  - date: "2026-12-31"
    event: "Canada Clean Fuel Regulations (CFR) Credit Reconciliation"
    authority: "ECCC"
    country: "CA"
    impact: "CRITICAL"
    statutory_penalty: "Credit deficit surrender penalties"
